# Plateforme de monitoring de logs SaaS - Semaine 1
# Demarrage : docker compose up -d --build

x-common: &restart
  restart: unless-stopped

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${STACK_VERSION:-8.13.4}
    <<: *restart
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false      # developpement local uniquement
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -Eq '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [logs-net]

  logstash:
    image: docker.elastic.co/logstash/logstash:${STACK_VERSION:-8.13.4}
    <<: *restart
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "9600:9600"
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./data/uploads:/data/uploads
      - logstashdata:/usr/share/logstash/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9600 | grep -q '\"status\"'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    networks: [logs-net]

  kibana:
    image: docker.elastic.co/kibana/kibana:${STACK_VERSION:-8.13.4}
    <<: *restart
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:5601/api/status | grep -q '\"level\":\"available\"'"]
      interval: 20s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks: [logs-net]

  mongo:
    image: mongo:7
    <<: *restart
    env_file: .env
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks: [logs-net]

  redis:
    image: redis:7-alpine
    <<: *restart
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [logs-net]

  backend:
    build: ./backend
    <<: *restart
    env_file: .env
    depends_on:
      elasticsearch:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks: [logs-net]

networks:
  logs-net:
    driver: bridge

volumes:
  esdata:
  logstashdata:
  mongodata:
  redisdata:

# Pipeline CSV - SaaS Log Monitor

input {
  file {
    path => "/data/uploads/*.csv"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_csv"

    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  if [log][file][path] =~ /\.csv$/ {

    csv {
      separator => ","
      skip_header => true
      columns => [
        "timestamp",
        "log_type",
        "level",
        "service",
        "method",
        "endpoint",
        "status_code",
        "response_time_ms",
        "client_ip",
        "message",
        "sql_query",
        "query_duration_ms"
      ]
    }

    mutate {
      convert => {
        "status_code" => "integer"
        "response_time_ms" => "float"
        "query_duration_ms" => "float"
      }
    }

    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }

    if [timestamp] and [service] and [message] {
      fingerprint {
        source => [
          "timestamp",
          "level",
          "service",
          "method",
          "endpoint",
          "status_code",
          "response_time_ms",
          "client_ip",
          "message",
          "log_type"
        ]
        concatenate_sources => true
        method => "SHA256"
        target => "[@metadata][fingerprint]"
      }
    }
  }
}

output {
  if [log][file][path] =~ /\.csv$/ and [@metadata][fingerprint] {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "saas-logs-%{+YYYY.MM.dd}"
      document_id => "%{[@metadata][fingerprint]}"
    }
  }
}
# Pipeline TXT - SaaS Log Monitor

input {
  file {
    path => "/data/uploads/*.txt"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_txt"
    codec => plain {
      charset => "UTF-8"
    }
  }
}

filter {
  if [log][file][path] =~ /\.txt$/ {
    mutate {
      add_field => {
        "log_type" => "text"
      }
    }

    grok {
      match => {
        "message" => [
          "^%{TIMESTAMP_ISO8601:timestamp}[[:space:]]+(?<level>TRACE|DEBUG|INFO|WARN|ERROR|FATAL)[[:space:]]+(?<service>[A-Za-z0-9._-]+)[[:space:]]+%{GREEDYDATA:text_message}$",
          "^%{GREEDYDATA:text_message}$"
        ]
      }
      tag_on_failure => ["_txtformatinfo"]
    }

    if [timestamp] {
      date {
        match => ["timestamp", "ISO8601", "yyyy-MM-dd HH:mm:ss", "yyyy-MM-dd'T'HH:mm:ss.SSSZ"]
        target => "@timestamp"
        tag_on_failure => ["_dateparsefailure"]
      }
    }
  }
}

output {
  if [log][file][path] =~ /\.txt$/ {
    elasticsearch {
      hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
      index => "saas-logs-%{+YYYY.MM.dd}"
    }
  }
}

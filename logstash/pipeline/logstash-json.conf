# Pipeline minimal de la semaine 1 : lit les fichiers JSON (un objet par ligne)
# deposes dans data/uploads et les indexe dans Elasticsearch.
# Semaine 2 : ajout du filtre date, de la gestion d'erreurs et du pipeline CSV.
input {
  file {
    path => "/data/uploads/*.json"
    codec => "json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "saas-logs-%{+YYYY.MM.dd}"
  }
}

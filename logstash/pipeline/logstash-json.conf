
# Pipeline JSON - SaaS Log Monitor

input {
  file {
    path => "/data/uploads/*.json"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb_json"

    codec => json {
      target => "log_data"
    }
  }
}

filter {
  # Placer les champs JSON à la racine de l'événement
  if [log_data] {
    mutate {
      rename => {
        "[log_data][timestamp]" => "timestamp"
        "[log_data][log_type]" => "log_type"
        "[log_data][level]" => "level"
        "[log_data][service]" => "service"
        "[log_data][method]" => "method"
        "[log_data][endpoint]" => "endpoint"
        "[log_data][status_code]" => "status_code"
        "[log_data][response_time_ms]" => "response_time_ms"
        "[log_data][client_ip]" => "client_ip"
        "[log_data][message]" => "message"
        "[log_data][sql_query]" => "sql_query"
        "[log_data][query_duration_ms]" => "query_duration_ms"
      }
    }
  }

  if [log][file][path] =~ /\.json$/ {
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => ["_dateparsefailure"]
    }
  }

  mutate {
    convert => {
      "status_code" => "integer"
      "response_time_ms" => "float"
      "query_duration_ms" => "float"
    }
  }

  # Generate a deterministic ID to prevent duplicate indexing
  if [timestamp] and [service] and [message] {
    fingerprint {
      source => [
        "timestamp",
        "level",
        "service",
        "method",
        "endpoint",
        "status_code",
        "response_time_ms",
        "client_ip",
        "message",
        "log_type"
      ]
      concatenate_sources => true
      method => "SHA256"
      target => "[@metadata][fingerprint]"
    }
  }

  if "_jsonparsefailure" in [tags] or "_dateparsefailure" in [tags] {
    mutate {
      add_field => {
        "processing_error" => "JSON or timestamp parsing error"
      }
    }
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOSTS:http://elasticsearch:9200}"]
    index => "saas-logs-%{+YYYY.MM.dd}"
    document_id => "%{[@metadata][fingerprint]}"
  }
}
